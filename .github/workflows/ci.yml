# Corre a cada push e em cada PR contra `main`. A Vercel faz o seu próprio build
# no deploy; isto corre antes, para que um PR vermelho se veja no GitHub e não
# só depois de estar em produção.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Um push novo no mesmo branch cancela a corrida anterior em vez de a deixar a
# ocupar fila para um estado que já não interessa a ninguém.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Sem isto, o token do job vem com permissões de escrita. Nenhum destes passos
# escreve no repositório.
permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # As actions fixadas pelo SHA do commit, e não pela tag: uma tag muda de
    # sítio com um `git push --force` de quem a controla, e o que corre aqui
    # tem acesso ao repositório. O comentário com a versão é o que o
    # Dependabot lê para as continuar a atualizar (`.github/dependabot.yml`).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # `ci` e não `install`: instala exactamente o que está no lock e falha se o
      # `package.json` e o lock divergirem, em vez de os reconciliar em silêncio.
      # Os scripts de instalação dos pacotes ficam bloqueados — ver o comentário
      # `_comentario_allowScripts` no `package.json`.
      - name: Instalar
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run tipos

      # Uma chave em falta no `next-intl` não parte o build: aparece o nome da
      # chave no meio da página, na outra língua, e quem descobre é o cliente.
      - name: As duas línguas têm as mesmas chaves
        run: npm run mensagens

      # Os testes unitários de segurança (`testes/`): o escape do JSON-LD, a
      # leitura com teto das rotas públicas e a chave dos limites por ligação.
      # `node --test`, sem dependências novas.
      - name: Testes de segurança
        run: npm run testes

      # É isto que mantém o `npm audit` a zero ao longo do tempo, em vez de ser
      # um número que alguém pôs a zero uma vez e nunca mais olhou.
      #
      # ⚠️ Só as dependências **que chegam ao site** param o CI (`--omit=dev`).
      # Em 2026-10 apareceu um aviso no `braces`, que só entra pelo ESLint e não
      # tem versão corrigida: com o audit inteiro a bloquear, todos os PRs
      # ficavam vermelhos por uma coisa que ninguém aqui pode resolver e que
      # nunca corre no servidor nem no browser. As de desenvolvimento continuam
      # à vista no passo seguinte, que avisa sem parar.
      - name: Vulnerabilidades
        run: npm audit --audit-level=high --omit=dev

      - name: Vulnerabilidades nas ferramentas de desenvolvimento (só aviso)
        run: npm audit --audit-level=high
        continue-on-error: true

      # O build é também o que valida `src/data/*.json` com o `zod`: um preço
      # escrito como texto rebenta aqui, a dizer qual é o artigo.
      #
      # Com valores **sentinela** nas variáveis sensíveis: o build não as lê, e o
      # passo seguinte prova-o, procurando-as no que vai para o browser. Não são
      # segredos — são marcas inventadas para se poderem encontrar.
      - name: Build
        run: npm run build
        env:
          PAINEL_GITHUB_TOKEN: sentinela-ci-github-3f9c1a7e
          RESEND_API_KEY: sentinela-ci-resend-8b2d4e6f
          RESEND_NEWSLETTER_API_KEY: sentinela-ci-newsletter-5a7c9e1b
          UPSTASH_REDIS_REST_TOKEN: sentinela-ci-upstash-2e4f6a8c
          UPSTASH_REDIS_REST_URL: https://sentinela-ci-upstash.invalid

      # Nada do servidor no browser: nem os valores de cima, nem os endereços
      # das APIs com chave, nem a carta secreta. Ver `scripts/verificar-segredos.mjs`.
      - name: Nenhum segredo no que vai para o browser
        run: npm run segredos
        env:
          PAINEL_GITHUB_TOKEN: sentinela-ci-github-3f9c1a7e
          RESEND_API_KEY: sentinela-ci-resend-8b2d4e6f
          RESEND_NEWSLETTER_API_KEY: sentinela-ci-newsletter-5a7c9e1b
          UPSTASH_REDIS_REST_TOKEN: sentinela-ci-upstash-2e4f6a8c
          UPSTASH_REDIS_REST_URL: https://sentinela-ci-upstash.invalid

      # Teste de fumo: o site arranca mesmo e as páginas respondem. Apanha o erro
      # de runtime que passa por um build verde.
      - name: Arrancar o site
        run: |
          set -euo pipefail
          npm start &
          echo $! > .servidor.pid

          for _ in $(seq 1 60); do
            if curl -sf --max-time 2 -o /dev/null http://localhost:3000/; then
              echo "o site respondeu"
              exit 0
            fi
            sleep 1
          done

          echo "::error::o site não arrancou em 60s"
          exit 1

      # A lista cresce à medida que as páginas entram. As rotas portuguesas não
      # levam prefixo e as inglesas levam `/en` — é o `localePrefix: "as-needed"`
      # de `src/i18n/routing.ts`, e se alguém lhe mexer isto fica vermelho.
      - name: As páginas respondem
        run: |
          set -euo pipefail

          verificar() {
            local caminho="$1" esperado="$2" obtido
            obtido=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000${caminho}")
            if [ "$obtido" != "$esperado" ]; then
              echo "::error::${caminho} devolveu ${obtido}, esperava ${esperado}"
              return 1
            fi
            echo "✓ ${caminho} → ${obtido}"
          }

          verificar /                 200
          verificar /ementa           200
          verificar /contactos        200
          verificar /sobre            200
          verificar /privacidade      200
          verificar /cookies          200
          verificar /informacao-legal 200
          verificar /en               200
          verificar /en/ementa        200
          verificar /en/contactos     200
          verificar /newsletter/confirmar    200
          verificar /en/newsletter/confirmar 200
          verificar /sitemap.xml      200
          verificar /robots.txt       200
          verificar /uma-rota-que-nao-existe 404

      # Os cabeçalhos de segurança são configuração, e configuração parte-se sem
      # ninguém dar por isso. Aqui, parte-se com o CI vermelho.
      - name: Os cabeçalhos de segurança estão lá
        run: |
          set -euo pipefail
          cabecalhos=$(curl -s -D - -o /dev/null http://localhost:3000/ | tr 'A-Z' 'a-z')

          for cabecalho in \
            "content-security-policy" \
            "x-frame-options" \
            "x-content-type-options" \
            "referrer-policy" \
            "permissions-policy" \
            "strict-transport-security"
          do
            if ! grep -q "^${cabecalho}:" <<< "$cabecalhos"; then
              echo "::error::falta o cabeçalho ${cabecalho}"
              exit 1
            fi
            echo "✓ ${cabecalho}"
          done

          # Em produção não pode haver `unsafe-eval` — só o `dev` o usa.
          if grep -q "unsafe-eval" <<< "$cabecalhos"; then
            echo "::error::a CSP de produção traz 'unsafe-eval'"
            exit 1
          fi
          echo "✓ a CSP não traz 'unsafe-eval'"

          # Ninguém precisa de saber que framework está do outro lado.
          for caminho in / /painel/entrar; do
            if curl -s -D - -o /dev/null "http://localhost:3000${caminho}" | grep -qi '^x-powered-by:'; then
              echo "::error::${caminho} traz X-Powered-By"
              exit 1
            fi
          done
          echo "✓ sem X-Powered-By"

          # "Tudo menos o painel" é o painel, e não tudo o que comece por painel.
          for caminho in /painelx /painel-teste; do
            if ! curl -s -D - -o /dev/null "http://localhost:3000${caminho}" | grep -qi '^x-frame-options:'; then
              echo "::error::${caminho} saiu sem cabeçalhos de segurança"
              exit 1
            fi
          done
          echo "✓ /painelx e /painel-teste têm cabeçalhos de segurança"

      # O painel (`/painel`) é a única parte do site com sessão. Isto confirma,
      # sem segredos nenhuns definidos, que a porta está fechada e que a
      # variante da CSP com nonce é a que lá chega — ver `src/proxy.ts` e
      # `src/lib/cabecalhos.ts`.
      - name: O painel está fechado
        run: |
          set -euo pipefail

          # Sem sessão, `/painel` e as suas páginas mandam para a entrada.
          for caminho in /painel /painel/ementa /painel/casa /painel/newsletter /painel/newsletter/enviada/qualquer; do
            resposta=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "http://localhost:3000${caminho}")
            if [ "$resposta" != "307 http://localhost:3000/painel/entrar" ]; then
              echo "::error::${caminho} sem sessão devolveu '${resposta}', esperava 307 para /painel/entrar"
              exit 1
            fi
            echo "✓ ${caminho} → /painel/entrar"
          done

          # Um cookie com o nome certo e conteúdo inventado passa pelo proxy,
          # que só olha se existe — e tem de morrer no `exigirSessao()`.
          resposta=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' \
            -b 'preguica_sessao=s2.inventado.falso' http://localhost:3000/painel/ementa)
          if [ "$resposta" != "307 http://localhost:3000/painel/entrar" ]; then
            echo "::error::um cookie de sessão falso abriu o painel ('${resposta}')"
            exit 1
          fi
          echo "✓ um cookie de sessão falso não entra"

          cabecalhos=$(curl -s -D - -o /dev/null http://localhost:3000/painel/entrar | tr 'A-Z' 'a-z')
          csp=$(grep '^content-security-policy:' <<< "$cabecalhos")

          if [ "$(grep -c '^content-security-policy:' <<< "$cabecalhos")" != "1" ]; then
            echo "::error::/painel/entrar tem de ter exatamente uma CSP"
            exit 1
          fi
          grep -q "'nonce-" <<< "$csp" || { echo "::error::a CSP do painel não traz nonce"; exit 1; }
          script_src=$(grep -oE "script-src [^;]*" <<< "$csp")
          if grep -q "unsafe-inline\|unsafe-eval" <<< "$script_src"; then
            echo "::error::o script-src do painel traz '${script_src}'"
            exit 1
          fi
          grep -q '^cache-control: no-store' <<< "$cabecalhos" || { echo "::error::o painel não traz Cache-Control: no-store"; exit 1; }
          grep -q '^x-robots-tag: noindex' <<< "$cabecalhos" || { echo "::error::o painel não traz X-Robots-Tag: noindex"; exit 1; }
          echo "✓ o painel traz CSP com nonce, no-store e noindex"

          # Nenhuma página do painel pode ser gerada no build: uma página
          # estática com sessão serviria o mesmo HTML a toda a gente.
          if grep -q '"/painel' .next/prerender-manifest.json; then
            echo "::error::há rotas do painel no prerender-manifest"
            exit 1
          fi
          echo "✓ nenhuma rota do painel é estática"

      # O site não carrega nada de fora, e é isso que torna verdadeira a página
      # de cookies. Se alguém acrescentar um script, uma fonte ou um iframe de
      # terceiros, é aqui que se vê — antes de a página passar a mentir.
      - name: O site não carrega nada de fora
        run: |
          set -euo pipefail
          html=$(curl -s http://localhost:3000/)

          # Só conta o que o browser **carrega** sozinho: qualquer `src` e os
          # `href` dos `<link>` cujo `rel` provoca um pedido. Um `<a href>` para
          # o Maps ou para a DevPlus é um link normal — só é seguido se alguém
          # carregar nele, e por isso não entra aqui.
          externos=$(
            {
              grep -oE 'src="https?://[^"]*"' <<< "$html" || true
              grep -oE '<link[^>]*rel="(stylesheet|preload|preconnect|dns-prefetch|modulepreload|icon)"[^>]*>' <<< "$html" \
                | grep -oE 'href="https?://[^"]*"' || true
            } | sort -u
          )

          if [ -n "$externos" ]; then
            echo "::error::a página carrega recursos de terceiros:"
            echo "$externos"
            exit 1
          fi
          echo "✓ nenhum recurso de terceiros no HTML"

      # O convite da newsletter escreve em `/api/newsletter`. Sem segredos no CI
      # não se consegue ir até ao Resend, mas consegue-se confirmar que a porta
      # recusa o que não é um email **antes** de tocar em qualquer serviço — e
      # que nenhuma das duas rotas aceita um GET.
      - name: A newsletter recusa o que deve
        run: |
          set -euo pipefail

          obtido=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{"email":"isto-nao-e-um-email"}' \
            http://localhost:3000/api/newsletter)
          [ "$obtido" = "400" ] || { echo "::error::um email inválido devolveu ${obtido}, esperava 400"; exit 1; }
          echo "✓ um email inválido → 400"

          obtido=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{"convite":"n1.inventado.falso"}' \
            http://localhost:3000/api/newsletter/confirmar)
          [ "$obtido" != "200" ] || { echo "::error::um convite inventado foi aceite"; exit 1; }
          echo "✓ um convite inventado não entra (${obtido})"

          for rota in /api/newsletter /api/newsletter/confirmar; do
            obtido=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000${rota}")
            [ "$obtido" = "405" ] || { echo "::error::GET ${rota} devolveu ${obtido}, esperava 405"; exit 1; }
            echo "✓ GET ${rota} → 405"
          done

          # As três rotas públicas só leem JSON, e com teto (`src/lib/pedido.ts`):
          # um <form> de outro site não chega lá, e um corpo de megabytes é
          # recusado antes de ser analisado.
          grande=$(printf '{"email":"%*s@x.pt"}' 5000 '' | tr ' ' a)
          for rota in /api/newsletter /api/newsletter/confirmar /api/carta-secreta; do
            obtido=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H 'Content-Type: text/plain' -d '{"email":"a@b.pt"}' "http://localhost:3000${rota}")
            [ "$obtido" = "415" ] || { echo "::error::${rota} com text/plain devolveu ${obtido}, esperava 415"; exit 1; }

            obtido=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H 'Content-Type: application/json' --data-binary "$grande" "http://localhost:3000${rota}")
            [ "$obtido" = "413" ] || { echo "::error::${rota} com 5 KB devolveu ${obtido}, esperava 413"; exit 1; }
            echo "✓ ${rota}: text/plain → 415, 5 KB → 413"
          done

      # A página `/cookies` diz que não há nenhum. O caso que já apanhou o site
      # foi o do `next-intl`: grava a língua num cookie a quem abre `/en` com o
      # browser em português — ver `src/i18n/routing.ts`.
      - name: O site não grava cookies
        run: |
          set -euo pipefail
          falhou=0
          for caminho in / /en /ementa /en/ementa /privacidade /en/cookies; do
            for lingua in pt-PT en-GB; do
              if curl -s -o /dev/null -D - -H "Accept-Language: ${lingua}" \
                  "http://localhost:3000${caminho}" | grep -qi '^set-cookie:'; then
                echo "::error::${caminho} (${lingua}) devolve Set-Cookie"
                falhou=1
              fi
            done
          done
          [ "$falhou" = 0 ] && echo "✓ nenhuma página grava cookies"
          exit "$falhou"

      - name: Desligar o site
        if: always()
        run: kill "$(cat .servidor.pid)" || true
